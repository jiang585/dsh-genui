- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: high

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      tokenplan:
        apiKeyEnv: TOKENPLAN_API_KEY
        api: openai-completions
        baseURL: https://api.scnet.cn/api/llm/v1
        models:
          - id: DeepSeek-V4-Flash-0731
            contextWindow: 100000
            maxTokens: 100000
      opencode-go:
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        # The relay rejects any request without x-opencode-session (400
        # MissingSessionID). Adapters that derive it from the conversation id
        # keep their own per-conversation value, which wins over this one;
        # this fallback is what makes older builds of the adapter work too.
        headers:
          x-opencode-session: b1bac086-cf15-4b1e-83eb-eb804316ca10
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
          - id: deepseek-v4-flash-vision-exp
            name: DeepSeek V4 Flash Vision Exp
            contextWindow: 1000000
            maxTokens: 384000
            # 鍚嶅瓧閲屽氨鍐欑潃 vision锛汥eepSeek 宸叉妸璇ュ悕瀛楄矾鐢卞埌 V4.1 Flash锛堝師鐢熷妯℃€侊級
            input:
              - text
              - image
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            # DeepSeek 瀹樻柟锛歏4.1 Flash銆屽師鐢熸敮鎸佸妯℃€佽瑙夌悊瑙ｈ兘鍔涖€嶃€?            # 涔嬪墠杩欓噷鍙啓浜?text锛屾墍浠?Harness 涓嶄細鎶婂浘鐗囧彂缁欏畠銆?            # 鎻掍欢 schema锛歩nput 鏄?["text", "image"] 鐨勫瓙闆嗭紙dsh-llm-pi-ai锛夈€?            input:
            input:
              - text
              - image
            reasoningEfforts:
              high: high
              max: max
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
        apiKeyEnv: OPENCODE_GO_API_KEY
      easy-cliproxyapi:
        displayName: EasyCLIProxyAPI
        apiKeyEnv: EASYCLIPROXYAPI_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8317/v1
        models:
          - id: gemini-3.8-flash-high
            contextWindow: 1048576
            maxTokens: 65536
          - id: gemini-3-flash
          - id: gemini-pro-agent
          - id: gpt-oss-120b-medium
          - id: claude-opus-4-6-thinking
          - id: claude-sonnet-4-6
          - id: gemini-3.6-flash-high
          - id: gemini-3.7-flash-high
          - id: gemini-3.1-flash-image
          - id: gemini-3.1-pro-low
          - id: gemini-3.1-flash-lite
      sunge:
        apiKeyEnv: SUNGE_API_KEY
        api: openai-completions
        baseURL: https://api.b.ai/v1
        models:
          - id: glm-5.3-flash
            name: 鏅鸿氨5.3flash

- id: agent-preset-registry
  config:
    default: genui-live2
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
- id: hmr
  disabled: true
- id: schedule
  disabled: true
- id: session-title-llm
  disabled: true
