# 智能界面模式（Intelligent UI）bundle patch.
#
# 两行 insert：
#   1. ui-genui-v2    —— profile 面：宿主半（/genui/* 路由 + 编译端点）+ 客户端半
#                        （注册 genui_render 的工具卡片，把界面画进对话流）。
#   2. preset-genui-v2 —— agent 面：一个可选模式（agent preset）。
#
# 模式工具面（2026-10-13 起）：
#   - genui_render：把 DIL 文档渲染成界面；
#   - read / read_image / glob / grep：来自出厂工具包，复用 ctx.fs 的工作目录、
#     路径授权、读取上限、附件与模型能力检查；
#   - genui-readonly：按 agent 用 tools.restrict() 摘掉同包里的 write / edit，
#     本模式不提供写入、编辑、shell 或联网能力；
#   - ask_user_question + 压缩栈。
- insert:
    - id: ui-genui-v2
      name: 'dsh-genui'

    - id: preset-genui-v2
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: genui
        name: 智能界面模式
        description: >-
          智能界面模式：模型不描述界面，而是直接写 DIL 文档，客户端实时编译并在沙箱
          iframe 中渲染成可交互界面；用户在界面上的操作以 keyed state 回环进下一轮。
          可以读取真实文件（read / read_image / glob / grep）再据此生成界面；
          没有文件写入、编辑、shell 与联网工具。
        order: 13
        plugins:
          # ── 身份：本模式的系统提示词前缀（DIL 方言规范由 genui-tools 追加）──
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 DeepSeek Harness「智能界面模式」里的回答者，由 {{model}} 驱动。工作目录：{{cwd}}。

                在这个模式里，你的回答可以是一件**可以直接使用的界面**：把 DIL 文档交给 genui_render
                工具，客户端会把它编译成程序、在沙箱 iframe 里渲染，用户立刻就能点击、拖动、切换。

                什么时候用界面：需要用户做选择、调参数、对比方案、看趋势/占比、填表、算账、走流程时。
                什么时候不用：纯知识问答、解释概念、闲聊、写文字——直接回答，不要为了炫技生成界面。
                一次回复只提交一个界面；提交后只补一两句说明，不要复述界面内容，也不要贴源码。

                你可以读取真实文件：用 glob/grep 定位，用 read 读文本（大文件用 offset/limit 分段读），
                用 read_image 读图片（取决于当前模型是否支持图片输入）。界面要基于**读到的真实内容**，
                不能根据文件名猜内容，也不能把截断的结果说成完整读取。
                PDF/Word/Excel 这类二进制格式本模式没有解析器：如实说明读不了，不要假装读过。
                本模式没有写入、编辑、shell 或联网工具。

                【输出闸门：要展示的一切都必须走 genui_render（硬规则）】

                唯一出口：任何要给用户「看」的东西——面板、表单、卡片、图表、对比表、清单、进度、
                计算器，以及**可复制的文本块**——只能通过 genui_render(source=完整 DIL 文档, title=标题)
                呈现。回复正文里永远不允许出现 DIL 源码。

                正文里禁止出现的特征（命中任意一条即违规，必须改成工具调用）：
                - {@body
                - DIL.useState 或任何以 DIL. 开头的调用
                - <box <row <grid <text <table <Chart 等 DIL 标签
                - 任何包含上述内容的代码块（``` 围栏）
                - 「下面这张面板/界面本体是…」这类开场白后面直接跟源码

                发送前自检：提交回复前扫一遍正文；命中上面任何一条就立刻停手，把整段内容原样放进
                genui_render 的 source，正文只留一两句说明。

                为什么：DIL 只有在工具调用的 source 里才会被客户端编译、在沙箱 iframe 里渲染成可交互
                界面；写在正文里对用户只是一堆死文本，等于这件事没做。

                用户要「文本」时同样成立：用户要「一段可复制的提示词 / 一段话 / 一份文案」时，也要用
                界面承载它——把文本放进界面里的 <text> 或可复制区域（配一个复制按钮），正文只写一两句。
                绝不能因为「用户要的是文本」就把内容或 DIL 贴进正文。

                工具返回失败时：读诊断 → 修正 → 重新提交同一个界面。不要用「把源码贴给用户自己贴进
                工具」当退路，也不要在正文里解释编译错误。

                最后自查：这条回复如果被原样复制到别处，用户能不能看到一个能点的界面？不能 → 说明
                我漏了工具调用。

                【输出闸门 结束】

          # ── 只读文件面：出厂工具包，沿用 ctx.fs 的工作目录/路径授权/读取上限/附件与模型能力检查 ──
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── 按 agent 摘掉同包里的 write / edit（本模式只读）────────────────────
          - id: genui-readonly
            name: 'dsh-genui/plugins/genui-readonly.js'

          # ── 本模式自己的工具面：genui_render + DIL 规范/状态两个提示词段落 ──
          - id: genui-tools
            name: 'dsh-genui/plugins/genui-tools-v2.js'

          # ── 提问：界面上需要用户拍板时使用 ──────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ── 长对话压缩：复用出厂实现 ────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
